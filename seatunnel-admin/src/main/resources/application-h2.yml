# H2 内存数据库配置（开发测试使用）
datasource:
  dialect: h2

spring:
  datasource:
    cockpit:
      jdbc-url: jdbc:h2:mem:seatunnel_web;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
      username: sa
      password: 
      driver-class-name: org.h2.Driver
      maximum-pool-size: 10
      idle-timeout: 30000
      connection-test-query: SELECT 1

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  quartz:
    job-store-type: jdbc
    properties:
      org:
        quartz:
          scheduler:
            instanceName: seatunnel-web
            instanceId: AUTO
          threadPool:
            threadCount: 40
          jobStore:
            class: org.quartz.impl.jdbcjobstore.JobStoreTX
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            tablePrefix: QRTZ_
            isClustered: false
            useProperties: false
            dataSource: cockpit
          dataSource:
            cockpit:
              provider: hikaricp
              driver: org.h2.Driver
              URL: jdbc:h2:mem:seatunnel_web;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
              user: sa
              password: 
              maxConnections: 10
              validationQuery: SELECT 1
