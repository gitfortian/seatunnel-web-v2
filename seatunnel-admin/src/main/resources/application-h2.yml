spring:
  config:
    activate:
      on-profile: h2
  datasource:
    cockpit:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:seatunnel_web;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
      username: sa
      password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  quartz:
    job-store-type: memory