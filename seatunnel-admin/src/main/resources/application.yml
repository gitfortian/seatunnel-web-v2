server:
  port: 9527
  tomcat:
    accept-count: 1000
    max-connections: 10000

seatunnel:
  client:
    base-url: http://127.0.0.1:8080
    context-path:
    connect-timeout-ms: 2000
    read-timeout-ms: 10000

spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  application:
    name: seatunnel-web
  profiles:
    active: h2
  # Database configuration will be loaded from profile-specific files
  # application-h2.yml or application-mysql.yml
  main:
    allow-bean-definition-overriding: true
  jackson:
    time-zone: GMT+8

  ai:
    deepseek:
      api-key: sk-****
      base-url: "https://api.deepseek.com"
      chat:
        options:
          model: deepseek-chat
      embedding:
        enabled: false

logging:
  config: classpath:logback-spring.xml

management:
  endpoints:
    enabled-by-default: false

monitoring:
  collection:
    enabled: true
    interval: 60000
  jvm:
    interval: 60000
  clean:
    cron: "0 0 2 * * ?"
  application:
    name: "seatunel-web"
  instance:
    id: "seatunel-web-instance"
  thread:
    pool:
      size: 5
      max-size: 10
      queue-capacity: 100


